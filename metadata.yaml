name: astrbot_plugin_interrupter
display_name: 复读撤回打断机
short_desc: 群复读检测打断 + 引用消息回复"撤回"即可撤回
desc: |
  复读检测打断 + 引用撤回：

  **复读检测打断**（全平台可用）
  - 检测群内连续相同的消息（支持文本 / 图片 / 表情等混合消息）；
  - 达到触发条数后按概率发送"打断施法！"，未命中概率时可选跟风复读；
  - 可选同时撤回复读的消息（需机器人管理员权限，仅 OneBot v11）；
  - 同一串复读只打断一次，支持 `/复读 on|off` 分群开关（状态持久化）。

  **引用撤回**（OneBot v11 / aiocqhttp）
  - 引用任意消息回复"撤回"（触发词可配置），机器人自动撤回被引用的消息；
  - 可配置仅允许撤回机器人自己的消息；撤回后默认不再触发 LLM 回复；
  - 撤回失败（无权限、消息超时等）静默忽略。
version: 1.0.0
author: xiaoxi2760
repo: https://github.com/xiaoxi2760/astrbot_plugin_interrupter
